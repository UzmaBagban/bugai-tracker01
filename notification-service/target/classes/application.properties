spring.application.name=notification-service

# ================================================
# ?? SERVER CONFIGURATION ??
# ================================================
server.port=8084


# ================================================
# ?? DATABASE CONFIGURATION ??
# ================================================
# Notification service owns the bug_ai_notification schema
spring.datasource.url=jdbc:mysql://localhost:3306/bug_ai_notification
spring.datasource.username=root
spring.datasource.password=root#123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================================
# ?? JPA / HIBERNATE CONFIGURATION ??
# ================================================
# ddl-auto=update: Auto-create/alter tables from @Entity classes (DEV ONLY)
# In production, use validate to ensure schema matches code without modifying DB
spring.jpa.hibernate.ddl-auto=update

# Hibernate dialect for MySQL 8+ (generates MySQL-specific SQL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Show SQL queries in logs (helpful for debugging, disable in production)
spring.jpa.show-sql=true

# Format SQL queries for readability in logs
spring.jpa.properties.hibernate.format_sql=true

# Disable open-in-view to prevent lazy-loading issues
# Sessions close after service layer; explicit loading required in controllers
spring.jpa.open-in-view=false