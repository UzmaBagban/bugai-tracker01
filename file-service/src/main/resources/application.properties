# ===== SERVER CONFIGURATION =====
server.port=8086
server.servlet.context-path=/
spring.application.name=File Service

# ===== DATABASE CONFIGURATION =====
# MySQL connection settings for File Service
spring.datasource.url=jdbc:mysql://localhost:3306/bug_ai_file
spring.datasource.username=root
spring.datasource.password=root#123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA/HIBERNATE CONFIGURATION =====
# Entity scanning: only scan com.bugai.fileservice package
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ===== FILE UPLOAD CONFIGURATION =====
# Base directory for file storage (relative to application working directory)
# Creates subdirectories: uploads/YYYY-MM-DD/fileId.ext
file.upload.dir=./uploads

# Maximum file size for multipart requests (50 MB default)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===== LOGGING CONFIGURATION =====
# Log level for application classes
logging.level.com.bugai=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# ===== CHARSET ENCODING =====
spring.web.encoding.charset=UTF-8
spring.web.encoding.enabled=true
spring.web.encoding.force=true