# ?? Server ??????????????????????????????????????????????
server.port=8081

# ?? Datasource ??????????????????????????????????????????
# Auth service uses its own schema: bug_ai_auth
spring.datasource.url=jdbc:mysql://localhost:3306/bugai_auth
spring.datasource.username=root
spring.datasource.password=root#123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? JPA / Hibernate ?????????????????????????????????????
# update = create/alter tables automatically (use validate in prod)
spring.jpa.hibernate.ddl-auto=update
# Non-deprecated dialect for MySQL 8+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
# Explicitly disable open-in-view to avoid lazy-loading pitfalls
spring.jpa.open-in-view=false

# ?? App name ????????????????????????????????????????????
spring.application.name=auth-service