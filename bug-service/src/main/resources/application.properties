
# ============================================================
# BUG SERVICE - APPLICATION CONFIGURATION
# ============================================================

# ============================================================
# SERVER CONFIGURATION
# ============================================================
# Port on which Bug Service runs
server.port=8082

# Application name (used in logs and monitoring)
spring.application.name=bug-service

# ============================================================
# DATABASE CONFIGURATION
# ============================================================
# MySQL connection details for Bug Service
# Uses dedicated schema: bug_ai_bug
spring.datasource.url=jdbc:mysql://localhost:3306/bug_ai_bug?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA/HIBERNATE CONFIGURATION
# ============================================================
# Hibernate dialect for MySQL 8+
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# DDL mode: update creates/updates tables automatically
# For production, use 'validate' or 'none' with Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (disable in production)
spring.jpa.show-sql=true

# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# Disable Open Session in View to avoid lazy loading issues
spring.jpa.open-in-view=false

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
# Root logging level
logging.level.root=INFO

# Bug Service specific logging
logging.level.com.bugai.bug=DEBUG

# Hibernate SQL logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================================
# VALIDATION CONFIGURATION
# ============================================================
# Enable bean validation
spring.validation.enabled=true

# ============================================================
# JACKSON CONFIGURATION
# ============================================================
# Pretty print JSON responses (disable in production for smaller payloads)
spring.jackson.serialization.indent-output=true

# Include non-null fields only in JSON
spring.jackson.default-property-inclusion=non_null

# Date/time format
spring.jackson.serialization.write-dates-as-timestamps=false

# ============================================================
# ERROR HANDLING
# ============================================================
# Include exception details in error responses (disable in production)
server.error.include-exception=true
server.error.include-stacktrace=on_param
server.error.include-message=always