# ?? Application Name ??????????????????????????????????????????????
spring.application.name=analytics-service

# ?? Server ??????????????????????????????????????????????
server.port=8085
server.servlet.context-path=/

# ?? Datasource ??????????????????????????????????????????
# Analytics service uses its own schema: bug_ai_analytics
spring.datasource.url=jdbc:mysql://localhost:3306/bug_ai_analytics
spring.datasource.username=root
spring.datasource.password=root#123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? JPA / Hibernate ?????????????????????????????????????
# update = create/alter tables automatically (use validate in prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Format SQL output for readability in logs
spring.jpa.properties.hibernate.format_sql=true
# Explicitly disable open-in-view to avoid lazy-loading pitfalls
spring.jpa.open-in-view=false

# ?? Logging ??????????????????????????????????????????????
logging.level.root=INFO
logging.level.com.bugai=DEBUG